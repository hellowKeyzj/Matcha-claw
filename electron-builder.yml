appId: app.MatchaClaw.desktop
productName: MatchaClaw
copyright: Copyright © 2026 MatchaClaw
compression: maximum
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - dist
  # package.json main points at dist-electron/main/index.js; keep this list
  # explicit so stale dist-electron/electron/** bundles cannot ship.
  - dist-electron/main/**
  - dist-electron/preload/**
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
      - "!icons/*.md"
      - "!icons/*.svg"
      - "!bin/**"
      - "!cli/**"
      - "!screenshot/**"
  # OpenClaw package (node_modules copied separately by afterPack hook
  # because electron-builder respects .gitignore which excludes node_modules/)
  - from: build/openclaw/
    to: openclaw/
  # Pre-bundled third-party skills (full directories, not only SKILL.md)
  - from: build/preinstalled-skills/
    to: resources/preinstalled-skills/
  # Preloaded subagent templates
  - from: src/features/subagents/templates/
    to: resources/subagent-templates/
  # NOTE: OpenClaw plugin mirrors are bundled by the afterPack hook
  # (after-pack.cjs). Third-party plugins come from node_modules, while
  # Matcha-managed plugins come from build/openclaw-plugins/.

beforePack: ./scripts/after-pack.cjs
afterPack: ./scripts/after-pack.cjs

asar: true
asarUnpack:
  - "**/*.node"

# Disable native module rebuilding.
# Main-process @lydell/node-pty ships prebuilds selected by beforePack.
# OpenClaw native modules run in their own process and are copied/filtered
# separately by afterPack — @electron/rebuild must NOT touch either boundary.
npmRebuild: false

# Auto-update configuration
publish:
  - provider: generic
    url: https://www.senluopan.com/dav/
    useMultipleRangeRequest: false

# macOS Configuration
mac:
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin
    - from: runtime-host/dist/darwin-${arch}
      to: bin/darwin-${arch}
    - from: resources/cli/posix/
      to: cli/
  category: public.app-category.productivity
  icon: resources/icons/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: MatchaClaw requires microphone access for voice features
    NSCameraUsageDescription: MatchaClaw requires camera access for video features

dmg:
  # Explicit volume size avoids dmg-builder auto-size underestimation
  # that can fail with "No space left on device" on larger app bundles.
  # This only affects temporary build volume size, not final compressed dmg size.
  size: 2g
  background: resources/dmg-background.png
  icon: resources/icons/icon.icns
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - type: file
      x: 130
      y: 220
    - type: link
      path: /Applications
      x: 410
      y: 220

# Windows Configuration
win:
  # Skip update signature verification: Windows builds have no code-signing
  # certificate, so verifying would always fail on the updater.
  verifyUpdateCodeSignature: false
  extraResources:
    - from: resources/bin/win32-${arch}
      to: bin
    - from: runtime-host/dist/win32-${arch}
      to: bin/win32-${arch}
      filter:
        - "**/*"
    - from: resources/cli/win32/
      to: cli/
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  perMachine: false
  warningsAsErrors: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MatchaClaw
  uninstallDisplayName: MatchaClaw
  license: LICENSE
  include: scripts/installer.nsh
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
