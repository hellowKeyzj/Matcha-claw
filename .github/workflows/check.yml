# MatchaClaw CI Workflow
# Runs on pull requests
name: Check and Build

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-host-native:
    name: Runtime host native (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: '1.97.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Build native runtime host
        run: node scripts/build-runtime-host-native.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenClaw plugin source inputs
        run: pnpm run check:openclaw-plugin-inputs

      - name: Run linter
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Check trait boundary
        run: pnpm run check:trait-boundary

      - name: Check runtime-host crate DAG
        run: pnpm run check:runtime-host-crate-dag

      - name: Run runtime-host architecture contracts
        run: pnpm run test:runtime-host:contract

      - name: Run contract tests
        run: pnpm run test:contract

      - name: Run tests
        run: pnpm run test

  build:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SKIP_MATCHA_AGENT_BUILD: ${{ vars.SKIP_MATCHA_AGENT_BUILD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Bun
        if: env.SKIP_MATCHA_AGENT_BUILD != '1'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenClaw plugin source inputs
        run: pnpm run check:openclaw-plugin-inputs

      - name: Build matcha-agent
        if: env.SKIP_MATCHA_AGENT_BUILD != '1'
        run: pnpm run build:matcha-agent

      - name: Build Windows x64 native runtime host
        run: node scripts/build-runtime-host-native.mjs --platform win32 --arch x64

      - name: Build
        run: pnpm run build:vite
