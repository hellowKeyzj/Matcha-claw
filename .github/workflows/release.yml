          deb_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-deb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          rpm_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-rpm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          cleanup_package_roots() {
