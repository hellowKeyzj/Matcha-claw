        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.LINUX_X64_APPIMAGE_EVIDENCE_RECEIPT }}

      - name: Attest Linux x64 extracted deb package execution evidence
        if: matrix.platform == 'linux' && env.LINUX_X64_DEB_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.LINUX_X64_DEB_EVIDENCE_RECEIPT }}

      - name: Attest Linux x64 extracted rpm package execution evidence
        if: matrix.platform == 'linux' && env.LINUX_X64_RPM_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.LINUX_X64_RPM_EVIDENCE_RECEIPT }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/mac/MatchaClaw.app/**
            release/win-arm64-unpacked/**
            release/linux-arm64-unpacked/**
            release/runtime-host-package-evidence-*.json
            release/*.yml
            !release/builder-debug.yml
          retention-days: 7

  prove-macos-x64-packages:
    needs: release
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac'
    runs-on: macos-13
    steps:
      - name: Require macOS x64 native package-proof runner
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != "macOS" ] || [ "$RUNNER_ARCH" != "X64" ]; then
            echo "macOS x64 package proof requires a macOS/X64 runner; got $RUNNER_OS/$RUNNER_ARCH."
            exit 1
          fi

      - name: Checkout package smoke runner
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release

      - name: Prove macOS x64 mounted and extracted package runtime host
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$GITHUB_WORKSPACE/release"
          unpacked_root="$release_directory/mac/MatchaClaw.app"
          shopt -s nullglob
          dmg_packages=("$release_directory"/*-mac-x64.dmg)
          zip_packages=("$release_directory"/*-mac-x64.zip)
          if [ "${#dmg_packages[@]}" -ne 1 ] || [ "${#zip_packages[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS x64 DMG and ZIP from the release build; found DMG=${#dmg_packages[@]} ZIP=${#zip_packages[@]}."
            exit 1
          fi
          if [ ! -d "$unpacked_root" ]; then
            echo "macOS x64 unpacked application required by package smoke is missing: $unpacked_root"
            exit 1
          fi
          chmod +x "$unpacked_root/Contents/Resources/bin/darwin-x64/runtime-host" "$unpacked_root/Contents/Resources/bin/darwin-x64/runtime-host-guardian"

          mount_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-mounted-x64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          zip_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-unzipped-x64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          mounted=false
          cleanup_package_roots() {
            if [ "$mounted" = true ]; then
              hdiutil detach "$mount_root" -quiet || true
            fi
            rmdir "$mount_root" 2>/dev/null || true
            rm -rf "$zip_root"
          }
          trap cleanup_package_roots EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_root" "${dmg_packages[0]}"
          mounted=true
          dmg_installed_root="$mount_root/MatchaClaw.app"
          if [ ! -d "$dmg_installed_root" ]; then
            echo "Mounted DMG did not contain the expected application root: $dmg_installed_root"
            exit 1
          fi

          prove_package() {
            local target="$1"
            local package_path="$2"
            local installed_root="$3"
            local receipt_path="$4"
            local smoke_report
            local smoke_status
            set +e
            smoke_report="$(node scripts/package-smoke-runtime-host.mjs --platform darwin --arch x64 --target "$target" --unpacked "$unpacked_root" --package "$package_path" --installed "$installed_root" --receipt "$receipt_path" --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" --source-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --run 2>&1)"
            smoke_status=$?
            set -e
            printf '%s\n' "$smoke_report"
            if [ "$smoke_status" -ne 0 ]; then
              echo "Mounted or extracted macOS x64 ${target} package smoke failed with exit code $smoke_status."
              exit "$smoke_status"
            fi
            if ! printf '%s\n' "$smoke_report" | grep -Fx 'package-execution=installed-native-run (bootstrap-rejection-passed)' >/dev/null; then
              echo "Mounted or extracted macOS x64 ${target} package smoke did not record installed-native-run."
              exit 1
            fi
            if [ ! -f "$receipt_path" ]; then
              echo "Mounted or extracted macOS x64 ${target} package smoke did not produce its evidence receipt."
              exit 1
            fi
          }

          dmg_receipt_path="$release_directory/runtime-host-package-evidence-darwin-x64-dmg.json"
          prove_package dmg "${dmg_packages[0]}" "$dmg_installed_root" "$dmg_receipt_path"

          unzip -q "${zip_packages[0]}" -d "$zip_root"
          zip_installed_root="$zip_root/MatchaClaw.app"
          if [ ! -d "$zip_installed_root" ]; then
            echo "Extracted ZIP did not contain the expected application root: $zip_installed_root"
            exit 1
          fi
          zip_receipt_path="$release_directory/runtime-host-package-evidence-darwin-x64-zip.json"
          prove_package zip "${zip_packages[0]}" "$zip_installed_root" "$zip_receipt_path"
          echo "MACOS_X64_DMG_EVIDENCE_RECEIPT=$dmg_receipt_path" >> "$GITHUB_ENV"
          echo "MACOS_X64_ZIP_EVIDENCE_RECEIPT=$zip_receipt_path" >> "$GITHUB_ENV"

      - name: Attest macOS x64 mounted DMG package execution evidence
        if: env.MACOS_X64_DMG_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.MACOS_X64_DMG_EVIDENCE_RECEIPT }}

      - name: Attest macOS x64 extracted ZIP package execution evidence
        if: env.MACOS_X64_ZIP_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.MACOS_X64_ZIP_EVIDENCE_RECEIPT }}

      - name: Upload macOS x64 package evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-package-evidence-macos-x64
          path: release/runtime-host-package-evidence-darwin-x64-*.json
          if-no-files-found: error
          retention-days: 7

  prove-windows-arm64-package:
    needs: release
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'win'
    runs-on: windows-11-arm
    steps:
      - name: Require Windows ARM64 native package-proof runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') {
            throw "Windows ARM64 package proof requires a Windows/ARM64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH."
          }

      - name: Checkout package smoke runner
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release

      - name: Prove Windows ARM64 installed NSIS runtime host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release'
          $installers = @(Get-ChildItem -LiteralPath $releaseDirectory -File -Filter '*-win-arm64.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows ARM64 NSIS installer from the release build; found $($installers.Count)."
          }
          $installer = $installers[0]
          $unpackedRoot = Join-Path $releaseDirectory 'win-arm64-unpacked'
          if (-not (Test-Path -LiteralPath $unpackedRoot -PathType Container)) {
            throw "Windows ARM64 unpacked application required by package smoke is missing: $unpackedRoot"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP ("matchaclaw-installed-arm64-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N'))")
          if (Test-Path -LiteralPath $installRoot) {
            throw "Workflow-created ARM64 install root unexpectedly already exists: $installRoot"
          }

          try {
            $nsisInstallStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            & $installer.FullName /S "/D=$installRoot"
            $nsisInstallStopwatch.Stop()
            $nsisInstallExitCode = $LASTEXITCODE
            $nsisInstallDurationMs = [Math]::Floor($nsisInstallStopwatch.Elapsed.TotalMilliseconds)
            if ($nsisInstallExitCode -ne 0) {
              throw "Windows ARM64 NSIS installation failed with exit code $nsisInstallExitCode."
            }
            if (-not (Test-Path -LiteralPath $installRoot -PathType Container)) {
              throw "Windows ARM64 NSIS installer did not create the requested installed application root: $installRoot"
            }

            $receiptPath = Join-Path $releaseDirectory 'runtime-host-package-evidence-win32-arm64-nsis.json'
            $smokeReport = @(& node scripts/package-smoke-runtime-host.mjs --platform win32 --arch arm64 --target nsis --unpacked $unpackedRoot --package $installer.FullName --installed $installRoot --receipt $receiptPath --repository $env:GITHUB_REPOSITORY --workflow-ref "$env:GITHUB_WORKFLOW_REF" --source-revision $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT --nsis-install-duration-ms $nsisInstallDurationMs --nsis-install-exit-code $nsisInstallExitCode --run 2>&1)
            $smokeExitCode = $LASTEXITCODE
            $smokeReport | ForEach-Object { Write-Host $_ }
            if ($smokeExitCode -ne 0) {
              throw "Installed Windows ARM64 NSIS package smoke failed with exit code $smokeExitCode."
            }
            if (-not (($smokeReport | Out-String) -match '(?m)^package-execution=installed-native-run \(bootstrap-rejection-passed\)\s*$')) {
              throw 'Installed Windows ARM64 NSIS package smoke did not record installed-native-run.'
            }
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw 'Installed Windows ARM64 NSIS package smoke did not produce its evidence receipt.'
            }
            "WINDOWS_ARM64_NSIS_EVIDENCE_RECEIPT=$receiptPath" >> $env:GITHUB_ENV
          } finally {
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force
            }
          }

      - name: Attest Windows ARM64 NSIS package execution evidence
        if: env.WINDOWS_ARM64_NSIS_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.WINDOWS_ARM64_NSIS_EVIDENCE_RECEIPT }}

      - name: Upload Windows ARM64 package evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-package-evidence-windows-arm64
          path: release/runtime-host-package-evidence-win32-arm64-nsis.json
          if-no-files-found: error
          retention-days: 7

  prove-linux-arm64-packages:
    needs: release
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require Linux ARM64 native package-proof runner
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "ARM64" ]; then
            echo "Linux ARM64 package proof requires a Linux/ARM64 runner; got $RUNNER_OS/$RUNNER_ARCH."
            exit 1
          fi

      - name: Checkout package smoke runner
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Prove Linux ARM64 extracted package runtime host
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$GITHUB_WORKSPACE/release"
          unpacked_root="$release_directory/linux-arm64-unpacked"
          shopt -s nullglob
          appimage_packages=("$release_directory"/*-linux-arm64.AppImage)
          deb_packages=("$release_directory"/*-linux-arm64.deb)
          rpm_packages=("$release_directory"/*-linux-arm64.rpm)
          if [ "${#appimage_packages[@]}" -ne 1 ] || [ "${#deb_packages[@]}" -ne 1 ] || [ "${#rpm_packages[@]}" -ne 0 ]; then
            echo "Expected exactly one Linux ARM64 AppImage and deb, and no undeclared ARM64 rpm, from the release build; found AppImage=${#appimage_packages[@]} deb=${#deb_packages[@]} rpm=${#rpm_packages[@]}."
            exit 1
          fi
          if [ ! -d "$unpacked_root" ]; then
            echo "Linux ARM64 unpacked application required by package smoke is missing: $unpacked_root"
            exit 1
          fi
          chmod +x "$unpacked_root/resources/bin/linux-arm64/runtime-host" "$unpacked_root/resources/bin/linux-arm64/runtime-host-guardian"

          appimage_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-appimage-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          deb_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-deb-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          cleanup_package_roots() {
            rm -rf "$appimage_root" "$deb_root"
          }
          trap cleanup_package_roots EXIT

          appimage_extract_directory="$appimage_root/extract-workdir"
          mkdir -p "$appimage_extract_directory"
          (
            cd "$appimage_extract_directory"
            chmod +x "${appimage_packages[0]}"
            "${appimage_packages[0]}" --appimage-extract
          )
          appimage_installed_root="$appimage_extract_directory/squashfs-root/usr/lib/MatchaClaw"
          if [ ! -d "$appimage_installed_root" ]; then
            echo "AppImage extraction did not create the expected application root: $appimage_installed_root"
            exit 1
          fi

          dpkg-deb --extract "${deb_packages[0]}" "$deb_root/root"
          deb_installed_root="$deb_root/root/opt/MatchaClaw"
          if [ ! -d "$deb_installed_root" ]; then
            echo "Extracted deb package did not contain the expected application root: $deb_installed_root"
            exit 1
          fi

          prove_package() {
            local target="$1"
            local package_path="$2"
            local installed_root="$3"
            local receipt_path="$4"
            local smoke_report
            local smoke_status
            set +e
            smoke_report="$(node scripts/package-smoke-runtime-host.mjs --platform linux --arch arm64 --target "$target" --unpacked "$unpacked_root" --package "$package_path" --installed "$installed_root" --receipt "$receipt_path" --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" --source-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --run 2>&1)"
            smoke_status=$?
            set -e
            printf '%s\n' "$smoke_report"
            if [ "$smoke_status" -ne 0 ]; then
              echo "Extracted Linux ARM64 ${target} package smoke failed with exit code $smoke_status."
              exit "$smoke_status"
            fi
            if ! printf '%s\n' "$smoke_report" | grep -Fx 'package-execution=installed-native-run (bootstrap-rejection-passed)' >/dev/null; then
              echo "Extracted Linux ARM64 ${target} package smoke did not record installed-native-run."
              exit 1
            fi
            if [ ! -f "$receipt_path" ]; then
              echo "Extracted Linux ARM64 ${target} package smoke did not produce its evidence receipt."
              exit 1
            fi
          }

          appimage_receipt_path="$release_directory/runtime-host-package-evidence-linux-arm64-appimage.json"
          deb_receipt_path="$release_directory/runtime-host-package-evidence-linux-arm64-deb.json"
          prove_package AppImage "${appimage_packages[0]}" "$appimage_installed_root" "$appimage_receipt_path"
          prove_package deb "${deb_packages[0]}" "$deb_installed_root" "$deb_receipt_path"
          echo "LINUX_ARM64_APPIMAGE_EVIDENCE_RECEIPT=$appimage_receipt_path" >> "$GITHUB_ENV"
          echo "LINUX_ARM64_DEB_EVIDENCE_RECEIPT=$deb_receipt_path" >> "$GITHUB_ENV"

      - name: Attest Linux ARM64 extracted AppImage package execution evidence
        if: env.LINUX_ARM64_APPIMAGE_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.LINUX_ARM64_APPIMAGE_EVIDENCE_RECEIPT }}

      - name: Attest Linux ARM64 extracted deb package execution evidence
        if: env.LINUX_ARM64_DEB_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.LINUX_ARM64_DEB_EVIDENCE_RECEIPT }}

      - name: Upload Linux ARM64 package evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-package-evidence-linux-arm64
          path: release/runtime-host-package-evidence-linux-arm64-*.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job: Publish to GitHub Releases
  # ──────────────────────────────────────────────────────────────
  publish:
    needs: [release, prove-macos-x64-packages, prove-windows-arm64-package, prove-linux-arm64-packages]
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        (needs.prove-macos-x64-packages.result == 'success' || needs.prove-macos-x64-packages.result == 'skipped') &&
        (needs.prove-windows-arm64-package.result == 'success' || needs.prove-windows-arm64-package.result == 'skipped') &&
        (needs.prove-linux-arm64-packages.result == 'success' || needs.prove-linux-arm64-packages.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    env:
      UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
      UPDATE_SERVER_PORT: ${{ secrets.UPDATE_SERVER_PORT }}
      UPDATE_SERVER_USER: ${{ secrets.UPDATE_SERVER_USER }}
      UPDATE_SERVER_PATH: ${{ secrets.UPDATE_SERVER_PATH }}
      UPDATE_SERVER_SSH_KEY: ${{ secrets.UPDATE_SERVER_SSH_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List all downloaded artifacts
        run: |
          echo "=== All artifacts downloaded ==="
          find release-artifacts/ -type f -exec ls -lh {} \;
          echo ""
          echo "=== File tree ==="
          tree release-artifacts/ || find release-artifacts/ -print

      - name: Remove duplicate builder-debug files
        run: |
          echo "Removing builder-debug.yml files to avoid duplicate asset upload conflicts..."
          find release-artifacts/ -name "builder-debug.yml" -delete -print || true

      - name: Prepare deploy bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle
          find release-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "runtime-host-package-evidence-*.json" -o \
            -name "*.yml" -o \
            -name "*.blockmap" \
          \) -exec cp -f {} deploy-bundle/ \;
          echo "Prepared deploy bundle:"
          ls -lh deploy-bundle

      - name: Deploy update files to update server
        if: startsWith(github.ref, 'refs/tags/') && env.UPDATE_SERVER_HOST != '' && env.UPDATE_SERVER_USER != '' && env.UPDATE_SERVER_PATH != '' && env.UPDATE_SERVER_SSH_KEY != ''
        run: |
          set -euo pipefail
          port="${UPDATE_SERVER_PORT:-22}"

          install -m 700 -d ~/.ssh
          printf '%s' "$UPDATE_SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$UPDATE_SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -p "$port" "$UPDATE_SERVER_USER@$UPDATE_SERVER_HOST" "mkdir -p '$UPDATE_SERVER_PATH'"
          rsync -avz --delete -e "ssh -p $port" deploy-bundle/ "$UPDATE_SERVER_USER@$UPDATE_SERVER_HOST:$UPDATE_SERVER_PATH/"

      - name: Skip server deploy (missing secrets)
        if: startsWith(github.ref, 'refs/tags/') && (env.UPDATE_SERVER_HOST == '' || env.UPDATE_SERVER_USER == '' || env.UPDATE_SERVER_PATH == '' || env.UPDATE_SERVER_SSH_KEY == '')
        run: |
          echo "Server deploy skipped: missing one or more required secrets."
          echo "Required: UPDATE_SERVER_HOST, UPDATE_SERVER_USER, UPDATE_SERVER_PATH, UPDATE_SERVER_SSH_KEY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/runtime-host-package-evidence-*.json
            release-artifacts/**/*.yml
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          make_latest: ${{ !(contains(github.ref, 'alpha') || contains(github.ref, 'beta')) }}
          generate_release_notes: true
          body: |
            ## 🚀 MatchaClaw ${{ github.ref_name }}
             
            MatchaClaw - Graphical AI Assistant based on OpenClaw
            
            ### 📦 Downloads
            
            Please select the appropriate installer for your operating system and architecture:
            
            #### macOS
            - **Apple Silicon (M1/M2/M3/M4)**: `MatchaClaw-*-mac-arm64.dmg`
            - **Intel (x64)**: `MatchaClaw-*-mac-x64.dmg`
            
            #### Windows
            - **Installer (x64)**: `MatchaClaw-*-win-x64.exe`
            - **Installer (ARM64)**: `MatchaClaw-*-win-arm64.exe`
            
            #### Linux
            - **AppImage (x64)**: `MatchaClaw-*-linux-x86_64.AppImage` (Universal format, recommended)
            - **AppImage (ARM64)**: `MatchaClaw-*-linux-arm64.AppImage`
            - **Debian/Ubuntu (x64)**: `MatchaClaw-*-linux-amd64.deb`
            - **Debian/Ubuntu (ARM64)**: `MatchaClaw-*-linux-arm64.deb`
            - **RPM (x64)**: `MatchaClaw-*-linux-x86_64.rpm`
            
            ### 📝 Release Notes
            
            See the auto-generated release notes below for detailed changes.
            
            ### ⚠️ Installation Notes
            
            - **macOS**: On first launch, you may see "cannot verify developer". Go to System Preferences → Security & Privacy to allow the app to run
            - **Windows**: SmartScreen may block the app. Click "More info" → "Run anyway" to proceed
            - **Linux AppImage**: First run `chmod +x MatchaClaw-*.AppImage` to add execute permission. On Ubuntu 22.04 you may also need `sudo apt install libfuse2`; on Ubuntu 24.04 use `sudo apt install libfuse2t64`
            - **Linux .deb (Ubuntu 24.04)**: If installation fails due to missing dependencies, use `sudo apt install libgtk-3-0t64 libnotify4t64 libxss1t64` before installing
            
            ---
            
            💬 Found an issue? Please submit an [Issue](https://github.com/${{ github.repository }}/issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
