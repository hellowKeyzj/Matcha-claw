# MatchaClaw Release Workflow
# Builds and publishes releases for macOS, Windows, and Linux

name: Release
run-name: Release (${{ github.event_name }})

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
      platform:
        description: 'Build target platform'
        required: false
        default: 'win'
        type: choice
        options:
          - win
          - mac
          - linux
          - all
      skip_matcha_agent:
        description: 'Skip building and packaging matcha-agent'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          event="${{ github.event_name }}"
          platform="${{ github.event.inputs.platform }}"

          if [ "$event" = "push" ] || [ -z "$platform" ] || [ "$platform" = "all" ]; then
            include='[{"os":"macos-14","platform":"mac"},{"os":"windows-latest","platform":"win"},{"os":"ubuntu-latest","platform":"linux"}]'
          elif [ "$platform" = "win" ]; then
            include='[{"os":"windows-latest","platform":"win"}]'
          elif [ "$platform" = "mac" ]; then
            include='[{"os":"macos-14","platform":"mac"}]'
          elif [ "$platform" = "linux" ]; then
            include='[{"os":"ubuntu-latest","platform":"linux"}]'
          else
            echo "Unsupported platform input: $platform"
            exit 1
          fi

          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $include"

  release:
    needs: resolve-matrix
    strategy:
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}

    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: '1.97.0'
      SKIP_MATCHA_AGENT_BUILD: ${{ github.event.inputs.skip_matcha_agent == 'true' && '1' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Bun
        if: env.SKIP_MATCHA_AGENT_BUILD != '1'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu, aarch64-pc-windows-msvc, x86_64-pc-windows-msvc

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Windows bundled runtime dependencies
        if: matrix.platform == 'win'
        run: pnpm run prep:win-binaries

      - name: Validate OpenClaw plugin source inputs
        run: pnpm run check:openclaw-plugin-inputs

      - name: Download bundled MiniLM model
        run: pnpm run download:minilm-model

      - name: Download uv binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run uv:download:mac

      - name: Download Bun binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run bun:download:mac

      - name: Download uv binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run uv:download:win

      - name: Download uv binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run uv:download:linux

      - name: Download Bun binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run bun:download:linux

      # macOS specific steps
      - name: Free disk space (macOS)
        if: matrix.platform == 'mac'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          rm -rf ~/Library/Caches/electron-builder/dmg-builder* || true
          brew cleanup --prune=all 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      # --publish never: prevent electron-builder from auto-publishing to GitHub.
      # All artifacts are collected and published atomically in the publish job.
      - name: Verify Apple notarization credentials
        if: matrix.platform == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization credentials are incomplete."
            exit 1
          fi

          xcrun notarytool store-credentials "matchaclaw-notary-ci" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --validate

      - name: Build macOS
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          ulimit -n 65536
          echo "File descriptor limit: $(ulimit -n)"

          node scripts/build-runtime-host-native.mjs --platform darwin --arch x64
          node scripts/build-runtime-host-native.mjs --platform darwin --arch arm64
          pnpm run build:vite
          pnpm run build:matcha-agent
          pnpm exec zx scripts/bundle-openclaw.mjs
          pnpm exec zx scripts/bundle-openclaw-plugins.mjs
          pnpm run check:openclaw-plugin-mirrors
          pnpm exec zx scripts/bundle-preinstalled-skills.mjs

          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "macOS code signing certificate credentials are incomplete."
            exit 1
          fi

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization credentials are incomplete."
            exit 1
          fi

          json_field() {
            node -e '
              const fs = require("fs");
              try {
                const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const value = data[process.argv[2]];
                if (value !== undefined && value !== null) process.stdout.write(String(value));
              } catch {
              }
            ' "$1" "$2"
          }

          history_submission_id() {
            node -e '
              const fs = require("fs");
              try {
                const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const name = process.argv[2];
                const items = data.history || data.submissions || [];
                const hit = items.find((item) => item && item.name === name);
                if (hit && hit.id) process.stdout.write(String(hit.id));
              } catch {
              }
            ' "$1" "$2"
          }

          print_notary_log() {
            local submission_id="$1"
            xcrun notarytool log "$submission_id" --keychain-profile "matchaclaw-notary-ci" || true
          }

          handle_notary_status() {
            local arch="$1"
            local app_path="$2"
            local json_path="$3"
            local submission_id="$4"
            local status
            status="$(json_field "$json_path" status)"

            case "$status" in
              Accepted)
                echo "Notarization accepted for ${arch}: ${submission_id}"
                xcrun stapler staple "$app_path"
                xcrun stapler validate "$app_path"
                return 0
                ;;
              Invalid|Rejected)
                echo "Notarization failed for ${arch}: ${submission_id} status=${status}"
                print_notary_log "$submission_id"
                exit 1
                ;;
              "In Progress"|"")
                echo "Notarization still pending for ${arch}: ${submission_id} status=${status:-unknown}"
                return 2
                ;;
              *)
                echo "Notarization returned unexpected status for ${arch}: ${submission_id} status=${status}"
                return 2
                ;;
            esac
          }

          submit_notary() {
            local arch="$1"
            local app_path="$2"
            local submit_name="MatchaClaw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}.zip"
            local zip_path="release/notary/${submit_name}"
            local id_path="release/notary/${arch}.submission-id"
            local submit_json="release/notary/${arch}.submit.json"
            local history_json="release/notary/${arch}.history.json"

            if [ ! -d "$app_path" ]; then
              echo "Missing app bundle for ${arch}: ${app_path}"
              exit 1
            fi

            mkdir -p release/notary
            ditto -c -k --keepParent "$app_path" "$zip_path"

            if [ -s "$id_path" ]; then
              echo "Reusing recorded notarization submission for ${arch}: $(cat "$id_path")"
              return 0
            fi

            set +e
            xcrun notarytool submit "$zip_path" \
              --keychain-profile "matchaclaw-notary-ci" \
              --output-format json > "$submit_json"
            local submit_status=$?
            set -e

            if [ "$submit_status" -eq 0 ]; then
              json_field "$submit_json" id > "$id_path"
            else
              echo "Notarization submit did not complete cleanly for ${arch}; checking history before refusing to resubmit."
              xcrun notarytool history \
                --keychain-profile "matchaclaw-notary-ci" \
                --output-format json > "$history_json" || true
              history_submission_id "$history_json" "$submit_name" > "$id_path"
            fi

            if [ ! -s "$id_path" ]; then
              echo "Could not confirm a notarization submission for ${arch}."
              echo "Refusing to submit again automatically to avoid duplicate Apple notarization quota usage."
              exit 1
            fi

            echo "Recorded notarization submission for ${arch}: $(cat "$id_path")"
          }

          wait_notary() {
            local arch="$1"
            local app_path="$2"
            local id_path="release/notary/${arch}.submission-id"
            local submission_id
            local attempt=1
            local delay=60
            local wait_json="release/notary/${arch}.wait.json"
            local info_json="release/notary/${arch}.info.json"

            submission_id="$(cat "$id_path")"

            while true; do
              echo "Waiting for notarization ${submission_id} (${arch}) attempt ${attempt}"

              set +e
              xcrun notarytool wait "$submission_id" \
                --keychain-profile "matchaclaw-notary-ci" \
                --timeout 20m \
                --output-format json > "$wait_json"
              local wait_status=$?
              set -e

              if [ "$wait_status" -eq 0 ]; then
                if handle_notary_status "$arch" "$app_path" "$wait_json" "$submission_id"; then
                  return 0
                fi
              else
                echo "notarytool wait failed for existing submission ${submission_id}; querying info before retrying wait."
              fi

              if xcrun notarytool info "$submission_id" \
                --keychain-profile "matchaclaw-notary-ci" \
                --output-format json > "$info_json"; then
                if handle_notary_status "$arch" "$app_path" "$info_json" "$submission_id"; then
                  return 0
                fi
              else
                echo "notarytool info also failed for existing submission ${submission_id}; will retry wait only."
              fi

              echo "Waiting ${delay}s before retrying notarytool wait for ${submission_id}."
              sleep "$delay"
              attempt=$((attempt + 1))
              if [ "$delay" -lt 300 ]; then
                delay=$((delay * 2))
                if [ "$delay" -gt 300 ]; then
                  delay=300
                fi
              fi
            done
          }

          pnpm exec electron-builder --mac dir --x64 --arm64 --publish never -c.mac.notarize=false

          submit_notary x64 "release/mac/MatchaClaw.app"
          submit_notary arm64 "release/mac-arm64/MatchaClaw.app"

          wait_notary x64 "release/mac/MatchaClaw.app"
          wait_notary arm64 "release/mac-arm64/MatchaClaw.app"

          pnpm exec electron-builder --mac dmg zip --x64 --prepackaged "release/mac/MatchaClaw.app" --publish never -c.mac.notarize=false
          pnpm exec electron-builder --mac dmg zip --arm64 --prepackaged "release/mac-arm64/MatchaClaw.app" --publish never -c.mac.notarize=false

      - name: Prove macOS arm64 mounted package runtime host
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != "macOS" ] || [ "$RUNNER_ARCH" != "ARM64" ]; then
            echo "macOS arm64 package proof requires a macOS/ARM64 runner; got $RUNNER_OS/$RUNNER_ARCH."
            exit 1
          fi

          release_directory="$GITHUB_WORKSPACE/release"
          unpacked_root="$release_directory/mac-arm64/MatchaClaw.app"
          shopt -s nullglob
          dmg_packages=("$release_directory"/*-mac-arm64.dmg)
          zip_packages=("$release_directory"/*-mac-arm64.zip)
          if [ "${#dmg_packages[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS arm64 DMG created by this build; found ${#dmg_packages[@]}."
            exit 1
          fi
          if [ "${#zip_packages[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS arm64 ZIP created by this build; found ${#zip_packages[@]}."
            exit 1
          fi
          if [ ! -d "$unpacked_root" ]; then
            echo "macOS arm64 unpacked application required by package smoke is missing: $unpacked_root"
            exit 1
          fi

          mount_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-mounted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          zip_root="$(mktemp -d "$RUNNER_TEMP/matchaclaw-unzipped-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          mounted=false
          cleanup_package_roots() {
            if [ "$mounted" = true ]; then
              hdiutil detach "$mount_root" -quiet || true
            fi
            rmdir "$mount_root" 2>/dev/null || true
            rm -rf "$zip_root"
          }
          trap cleanup_package_roots EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_root" "${dmg_packages[0]}"
          mounted=true
          dmg_installed_root="$mount_root/MatchaClaw.app"
          if [ ! -d "$dmg_installed_root" ]; then
            echo "Mounted DMG did not contain the expected application root: $dmg_installed_root"
            exit 1
          fi

          dmg_receipt_path="$release_directory/runtime-host-package-evidence-darwin-arm64-dmg.json"
          set +e
          dmg_smoke_report="$(node scripts/package-smoke-runtime-host.mjs --platform darwin --arch arm64 --target dmg --unpacked "$unpacked_root" --package "${dmg_packages[0]}" --installed "$dmg_installed_root" --receipt "$dmg_receipt_path" --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" --source-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --run 2>&1)"
          dmg_smoke_status=$?
          set -e
          printf '%s\n' "$dmg_smoke_report"
          if [ "$dmg_smoke_status" -ne 0 ]; then
            echo "Mounted macOS arm64 DMG package smoke failed with exit code $dmg_smoke_status."
            exit "$dmg_smoke_status"
          fi
          if ! printf '%s\n' "$dmg_smoke_report" | grep -Fx 'package-execution=installed-native-run (bootstrap-rejection-passed)' >/dev/null; then
            echo 'Mounted macOS arm64 DMG package smoke did not record installed-native-run.'
            exit 1
          fi
          if [ ! -f "$dmg_receipt_path" ]; then
            echo 'Mounted macOS arm64 DMG package smoke did not produce its evidence receipt.'
            exit 1
          fi

          unzip -q "${zip_packages[0]}" -d "$zip_root"
          zip_installed_root="$zip_root/MatchaClaw.app"
          if [ ! -d "$zip_installed_root" ]; then
            echo "Extracted ZIP did not contain the expected application root: $zip_installed_root"
            exit 1
          fi

          zip_receipt_path="$release_directory/runtime-host-package-evidence-darwin-arm64-zip.json"
          set +e
          zip_smoke_report="$(node scripts/package-smoke-runtime-host.mjs --platform darwin --arch arm64 --target zip --unpacked "$unpacked_root" --package "${zip_packages[0]}" --installed "$zip_installed_root" --receipt "$zip_receipt_path" --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" --source-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --run 2>&1)"
          zip_smoke_status=$?
          set -e
          printf '%s\n' "$zip_smoke_report"
          if [ "$zip_smoke_status" -ne 0 ]; then
            echo "Extracted macOS arm64 ZIP package smoke failed with exit code $zip_smoke_status."
            exit "$zip_smoke_status"
          fi
          if ! printf '%s\n' "$zip_smoke_report" | grep -Fx 'package-execution=installed-native-run (bootstrap-rejection-passed)' >/dev/null; then
            echo 'Extracted macOS arm64 ZIP package smoke did not record installed-native-run.'
            exit 1
          fi
          if [ ! -f "$zip_receipt_path" ]; then
            echo 'Extracted macOS arm64 ZIP package smoke did not produce its evidence receipt.'
            exit 1
          fi
          echo "MACOS_ARM64_DMG_EVIDENCE_RECEIPT=$dmg_receipt_path" >> "$GITHUB_ENV"
          echo "MACOS_ARM64_ZIP_EVIDENCE_RECEIPT=$zip_receipt_path" >> "$GITHUB_ENV"

      - name: Attest macOS arm64 mounted DMG package execution evidence
        if: matrix.platform == 'mac' && env.MACOS_ARM64_DMG_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.MACOS_ARM64_DMG_EVIDENCE_RECEIPT }}

      - name: Attest macOS arm64 extracted ZIP package execution evidence
        if: matrix.platform == 'mac' && env.MACOS_ARM64_ZIP_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.MACOS_ARM64_ZIP_EVIDENCE_RECEIPT }}

      # Windows specific steps
      - name: Build Windows native runtime hosts
        if: matrix.platform == 'win'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL (
            echo Windows MSVC build tools are unavailable.
            exit /b 1
          )
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
          where cl.exe | findstr /i /c:"\Hostx64\x64\cl.exe" >nul || (
            echo Windows x64 MSVC compiler is unavailable.
            exit /b 1
          )
          node scripts/build-runtime-host-native.mjs --platform win32 --arch x64
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64
          where cl.exe | findstr /i /c:"\Hostx64\arm64\cl.exe" >nul || (
            echo Windows ARM64 MSVC compiler is unavailable.
            exit /b 1
          )
          node scripts/build-runtime-host-native.mjs --platform win32 --arch arm64

      - name: Build Windows
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run build:vite && pnpm run build:matcha-agent && pnpm exec zx scripts/bundle-openclaw.mjs && pnpm exec zx scripts/bundle-openclaw-plugins.mjs && pnpm run check:openclaw-plugin-mirrors && pnpm exec zx scripts/bundle-preinstalled-skills.mjs
          pnpm exec electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prove Windows x64 installed NSIS runtime host
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Installed NSIS proof requires a Windows x64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH."
          }

          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release'
          $installers = @(Get-ChildItem -LiteralPath $releaseDirectory -File -Filter '*-win-x64.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 NSIS installer from the release build; found $($installers.Count)."
          }
          $installer = $installers[0]
          $unpackedRoot = Join-Path $releaseDirectory 'win-unpacked'
          if (-not (Test-Path -LiteralPath $unpackedRoot -PathType Container)) {
            throw "Windows x64 unpacked application required by package smoke is missing: $unpackedRoot"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP ("matchaclaw-installed-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N'))")
          if (Test-Path -LiteralPath $installRoot) {
            throw "Workflow-created install root unexpectedly already exists: $installRoot"
          }

          try {
            $nsisInstallStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            & $installer.FullName /S "/D=$installRoot"
            $nsisInstallStopwatch.Stop()
            $nsisInstallExitCode = $LASTEXITCODE
            $nsisInstallDurationMs = [Math]::Floor($nsisInstallStopwatch.Elapsed.TotalMilliseconds)
            if ($nsisInstallExitCode -ne 0) {
              throw "NSIS installation failed with exit code $nsisInstallExitCode."
            }
            if (-not (Test-Path -LiteralPath $installRoot -PathType Container)) {
              throw "NSIS installer did not create the requested installed application root: $installRoot"
            }

            $receiptPath = Join-Path $releaseDirectory 'runtime-host-package-evidence-win32-x64-nsis.json'
            $smokeReport = @(& node scripts/package-smoke-runtime-host.mjs --platform win32 --arch x64 --target nsis --unpacked $unpackedRoot --package $installer.FullName --installed $installRoot --receipt $receiptPath --repository $env:GITHUB_REPOSITORY --workflow-ref "$env:GITHUB_WORKFLOW_REF" --source-revision $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT --nsis-install-duration-ms $nsisInstallDurationMs --nsis-install-exit-code $nsisInstallExitCode --run 2>&1)
            $smokeExitCode = $LASTEXITCODE
            $smokeReport | ForEach-Object { Write-Host $_ }
            if ($smokeExitCode -ne 0) {
              throw "Installed NSIS package smoke failed with exit code $smokeExitCode."
            }
            if (-not (($smokeReport | Out-String) -match '(?m)^package-execution=installed-native-run \(bootstrap-rejection-passed\)\s*$')) {
              throw 'Installed NSIS package smoke did not record installed-native-run.'
            }
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw 'Installed NSIS package smoke did not produce its evidence receipt.'
            }
            "WINDOWS_NSIS_EVIDENCE_RECEIPT=$receiptPath" >> $env:GITHUB_ENV
          } finally {
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force
            }
          }

      - name: Attest Windows x64 NSIS package execution evidence
        if: matrix.platform == 'win' && env.WINDOWS_NSIS_EVIDENCE_RECEIPT != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.WINDOWS_NSIS_EVIDENCE_RECEIPT }}

      # Linux specific steps
      - name: Install Linux ARM64 Rust linker
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Linux
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
