            "${appimage_packages[0]}" --appimage-extract
          )
          appimage_installed_root="$appimage_extract_directory/squashfs-root/usr/lib/MatchaClaw"
          if [ ! -d "$appimage_installed_root" ]; then
            echo "AppImage extraction did not create the expected application root: $appimage_installed_root"
            exit 1
          fi

          dpkg-deb --extract "${deb_packages[0]}" "$deb_root/root"
          (
            cd "$rpm_root"
            rpm2cpio "${rpm_packages[0]}" | cpio -idm --quiet
          )

          deb_installed_root="$deb_root/root/opt/MatchaClaw"
          rpm_installed_root="$rpm_root/opt/MatchaClaw"
          for installed_root in "$deb_installed_root" "$rpm_installed_root"; do
            if [ ! -d "$installed_root" ]; then
              echo "Extracted package did not contain the expected application root: $installed_root"
              exit 1
            fi
          done

          prove_package() {
            local target="$1"
            local package_path="$2"
            local installed_root="$3"
            local receipt_path="$4"
            local smoke_report
            local smoke_status
            set +e
            smoke_report="$(node scripts/package-smoke-runtime-host.mjs --platform linux --arch x64 --target "$target" --unpacked "$unpacked_root" --package "$package_path" --installed "$installed_root" --receipt "$receipt_path" --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" --source-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --run 2>&1)"
            smoke_status=$?
            set -e
            printf '%s\n' "$smoke_report"
            if [ "$smoke_status" -ne 0 ]; then
              echo "Extracted Linux x64 ${target} package smoke failed with exit code $smoke_status."
              exit "$smoke_status"
            fi
            if ! printf '%s\n' "$smoke_report" | grep -Fx 'package-execution=installed-native-run (bootstrap-rejection-passed)' >/dev/null; then
