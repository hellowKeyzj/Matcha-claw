          deb_receipt_path="$release_directory/runtime-host-package-evidence-linux-x64-deb.json"
          rpm_receipt_path="$release_directory/runtime-host-package-evidence-linux-x64-rpm.json"
          prove_package AppImage "${appimage_packages[0]}" "$appimage_installed_root" "$appimage_receipt_path"
          prove_package deb "${deb_packages[0]}" "$deb_installed_root" "$deb_receipt_path"
          prove_package rpm "${rpm_packages[0]}" "$rpm_installed_root" "$rpm_receipt_path"
