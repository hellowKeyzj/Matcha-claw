[package]
name = "openclaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
environment = { version = "0.1.0", path = "../../domains/environment" }
foundation = { version = "0.1.0", path = "../../foundation" }
organization = { version = "0.1.0", path = "../../domains/organization" }
futures-util.workspace = true
getrandom.workspace = true
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
json5.workspace = true
platform = { version = "0.1.0", path = "../../platform" }
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
zip.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
foundation = { version = "0.1.0", path = "../../foundation", features = ["test-support"] }
tokio-rustls.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
