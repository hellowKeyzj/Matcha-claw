[package]
name = "matcha-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
diagnostics-module = { package = "diagnostics", version = "0.1.0", path = "../../modules/diagnostics" }
base64.workspace = true
chrono.workspace = true
foundation = { version = "0.1.0", path = "../../foundation" }
organization = { version = "0.1.0", path = "../../modules/organization" }
sessions-module = { package = "sessions", version = "0.1.0", path = "../../modules/sessions" }
