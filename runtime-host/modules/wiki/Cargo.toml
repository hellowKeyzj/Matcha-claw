[package]
name = "wiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
document-parser = { version = "0.1.0", path = "../../external/document-parser" }
arrow-array.workspace = true
arrow-schema.workspace = true
base64.workspace = true
chrono.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
foundation = { version = "0.1.0", path = "../../foundation" }
futures-util.workspace = true
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lancedb.workspace = true
notify.workspace = true
ort = { workspace = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }
platform = { version = "0.1.0", path = "../../platform" }
reqwest = { workspace = true, features = ["json", "multipart"] }
regex = "1"
unicode-normalization = "0.1.25"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
tokenizers.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
