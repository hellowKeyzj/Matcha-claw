[package]
name = "wiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anydoc.workspace = true
base64.workspace = true
calamine.workspace = true
chrono.workspace = true
docx-rs.workspace = true
epub.workspace = true
foundation = { version = "0.1.0", path = "../../foundation" }
futures-util.workspace = true
html2text.workspace = true
image.workspace = true
mobi.workspace = true
notify.workspace = true
office_oxide.workspace = true
ort = { workspace = true, default-features = false, features = ["std", "load-dynamic", "api-24"] }
pdfium-render.workspace = true
platform = { version = "0.1.0", path = "../../platform" }
reqwest = { workspace = true, features = ["json", "multipart"] }
regex = "1"
unicode-normalization = "0.1.25"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
tokenizers.workspace = true
zip.workspace = true

# Newer LanceDB releases dropped Intel macOS support: lancedb/lancedb#2836.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
arrow-array = "56.2"
arrow-schema = "56.2"
lancedb = { version = "=0.22.3", default-features = false }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
lancedb.workspace = true
