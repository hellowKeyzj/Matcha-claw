[workspace]
members = [
  "foundation",
  "domains/environment",
  "domains/fleet",
  "domains/organization",
  "integrations/matcha-agent",
  "integrations/openclaw",
  "host",
  "platform",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
getrandom = "0.3"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
futures-util = "0.3"
json5 = "1.3.1"
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "stream"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
cron = "0.17"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["__rustls-tls", "connect", "handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
] }
