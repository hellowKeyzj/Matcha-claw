[workspace]
members = [
  "foundation",
  "modules/fleet",
  "modules/organization",
  "external/clawhub",
  "integrations/matcha-agent",
  "integrations/openclaw",
  "modules/channels",
  "modules/security",
  "modules/settings",
  "modules/connectors",
  "modules/cron",
  "modules/usage",
  "modules/diagnostics",
  "modules/call-log",
  "modules/task-manager",
  "modules/subagents",
  "modules/workspace",
  "modules/toolchain",
  "modules/platform-tools",
  "modules/provider",
  "modules/sessions",
  "modules/wiki",
  "modules/runtime-directory",
  "modules/plugins",
  "modules/skills",
  "modules/sealed-resource",
  "host",
  "platform",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
anydoc = "0.1.6"
arrow-array = "57"
arrow-schema = "57"
calamine = "0.34.0"
docx-rs = "0.4.20"
epub = "2.1.5"
getrandom = "0.3"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
futures-util = "0.3"
html2text = { version = "0.17.1", default-features = false, features = ["xml"] }
image = { version = "0.25", default-features = false, features = ["png"] }
json5 = "1.3.1"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "stream"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
lancedb = "0.27.2"
mobi = "0.8"
notify = "8"
office_oxide = "=0.1.2"
ort = "2.0.0-rc.13"
pdfium-render = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
cron = "0.17"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["__rustls-tls", "connect", "handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
zeroize = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
] }
