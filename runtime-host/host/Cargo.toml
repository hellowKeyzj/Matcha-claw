[package]
name = "runtime-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "runtime-host-mcp"
path = "src/bin/runtime-host-mcp.rs"

[dependencies]
fleet = { version = "0.1.0", path = "../modules/fleet" }
base64.workspace = true
channels = { version = "0.1.0", path = "../modules/channels" }
security = { version = "0.1.0", path = "../modules/security" }
settings = { version = "0.1.0", path = "../modules/settings" }
connectors = { version = "0.1.0", path = "../modules/connectors" }
cron = { version = "0.1.0", path = "../modules/cron" }
usage = { version = "0.1.0", path = "../modules/usage" }
diagnostics = { version = "0.1.0", path = "../modules/diagnostics" }
task-manager = { version = "0.1.0", path = "../modules/task-manager" }
subagents = { version = "0.1.0", path = "../modules/subagents" }
workspace = { version = "0.1.0", path = "../modules/workspace" }
wiki = { version = "0.1.0", path = "../modules/wiki" }
platform-tools = { version = "0.1.0", path = "../modules/platform-tools" }
provider-module = { package = "provider", version = "0.1.0", path = "../modules/provider" }
plugins-module = { package = "plugins", version = "0.1.0", path = "../modules/plugins" }
skills-module = { package = "skills", version = "0.1.0", path = "../modules/skills" }
sealed-resource = { version = "0.1.0", path = "../modules/sealed-resource" }
sessions-module = { package = "sessions", version = "0.1.0", path = "../modules/sessions" }
runtime-directory = { version = "0.1.0", path = "../modules/runtime-directory" }
clawhub = { version = "0.1.0", path = "../external/clawhub" }
foundation = { version = "0.1.0", path = "../foundation" }
toolchain = { version = "0.1.0", path = "../modules/toolchain" }
getrandom.workspace = true
matcha-agent = { version = "0.1.0", path = "../integrations/matcha-agent" }
openclaw = { version = "0.1.0", path = "../integrations/openclaw" }
organization = { version = "0.1.0", path = "../modules/organization" }
platform = { version = "0.1.0", path = "../platform" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tokio-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
foundation = { version = "0.1.0", path = "../foundation", features = ["test-support"] }
openclaw = { version = "0.1.0", path = "../integrations/openclaw", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
