<details data-design-tools=""><summary aria-label="展开设计快照工具">设计</summary><div><a href="index.html">返回目录</a><button type="button" data-design-theme-toggle="">浅 / 深色</button><small>独立静态 DOM · 合成场景</small><div data-design-navigation="" style="display: flex; flex-direction: column; gap: 6px; width: 100%;"><select data-design-page-group="" aria-label="页面分组"></select><select data-design-page-picker="" aria-label="选择页面或页签"></select><button type="button" data-design-page-open="">打开所选页面</button></div></div></details><script>window.__designSnapshotReady=false;(async function restoreSnapshot(scroll, compressedAssets) {
  for (const { token, gzip } of compressedAssets) {
    const bytes = Uint8Array.from(atob(gzip), (character) => character.charCodeAt(0));
    const decompressed = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(decompressed)}`;
    for (const element of document.querySelectorAll('*')) {
      for (const attribute of [...element.attributes]) {
        if (attribute.value.includes(token)) element.setAttribute(attribute.name, attribute.value.replaceAll(token, url));
      }
    }
    for (const style of document.querySelectorAll('style')) style.textContent = style.textContent.replaceAll(token, url);
  }
  document.querySelectorAll('[data-design-popover-open]').forEach((element) => {
    const source = element.dataset.designPopoverSource
      ? document.getElementById(element.dataset.designPopoverSource)
      : document.querySelector(`[data-design-popover-source="${CSS.escape(element.id)}"]`);
    element.showPopover(source ? { source } : undefined);
  });
  const restoreScroll = () => {
    document.querySelectorAll('[data-design-scroll]').forEach((element) => {
      const [left, top] = JSON.parse(element.dataset.designScroll);
      element.scrollTo({ left, top, behavior: 'instant' });
    });
    window.scrollTo({ left: scroll[0], top: scroll[1], behavior: 'instant' });
  };
  document.querySelectorAll('[data-design-indeterminate]').forEach((element) => { element.indeterminate = true; });
  const focused = document.querySelector('[data-design-focused]');
  focused?.focus({ preventScroll: true });
  focused?.addEventListener('blur', () => {
    focused.removeAttribute('data-design-focused');
    focused.removeAttribute('data-design-focus-visible');
  }, { once: true });
  if (focused?.dataset.designSelection) focused.setSelectionRange(...JSON.parse(focused.dataset.designSelection));
  restoreScroll();
  window.addEventListener('load', restoreScroll, { once: true });
  document.fonts.ready.then(restoreScroll);
  document.addEventListener('submit', (event) => event.preventDefault());
  document.addEventListener('click', (event) => {
    if (event.target.closest('[data-design-unmapped-link]')) event.preventDefault();
  });
  document.querySelector('[data-design-theme-toggle]').addEventListener('click', () => {
    const root = document.documentElement;
    const theme = root.classList.contains('dark') ? 'light' : 'dark';
    for (const element of [root, document.body]) {
      element.classList.remove('light', 'dark');
      if (element === root) element.classList.add(theme);
      if (element.hasAttribute('data-theme')) element.setAttribute('data-theme', theme);
      if (element.hasAttribute('data-theme-surface')) element.setAttribute('data-theme-surface', theme);
    }
    root.style.colorScheme = theme;
  });
  await document.fonts.ready;
  await Promise.all([...document.images].map((image) => image.decode().catch(() => {})));
  restoreScroll();
  window.__designSnapshotReady = true;
})([0,0],[]).catch(error=>{window.__designSnapshotError=error.message;console.error(error)});</script>

}]</script><script data-design-navigation="">(function activateNavigation() {
  const pages = JSON.parse(document.querySelector('#design-navigation-pages').textContent);
  const available = new Set(pages.map((page) => page.id));
  for (const element of document.querySelectorAll('[data-design-target]')) {
    if (available.has(element.dataset.designTarget)) continue;
    element.dataset.designUnavailable = '';
    element.title = '当前分组不包含此页面，请使用完整包';
    if (element.localName === 'a') element.setAttribute('href', '#');
  }
  document.addEventListener('click', (event) => {
    const disclosure = event.target.closest('[data-design-disclosure]');
    if (disclosure) {
      const panel = document.getElementById(disclosure.dataset.designDisclosure);
      if (panel) {
        const expanded = disclosure.getAttribute('aria-expanded') !== 'true';
        disclosure.setAttribute('aria-expanded', String(expanded));
        panel.hidden = !expanded;
      }
      return;
    }
    const target = event.target.closest('[data-design-target]');
    if (!target) return;
    event.preventDefault();
    if (!available.has(target.dataset.designTarget) || target.disabled || target.getAttribute('aria-disabled') === 'true') return;
    location.href = `${target.dataset.designTarget}.html`;
  });
  document.addEventListener('change', (event) => {
    if (event.target.localName !== 'select') return;
    const option = event.target.selectedOptions[0];
    if (!event.target.disabled && option?.dataset.designTarget && !option.disabled && available.has(option.dataset.designTarget)) location.href = `${option.dataset.designTarget}.html`;
  });
  document.addEventListener('keydown', (event) => {
    const target = event.target.closest('[data-design-target]');
    if (!target || target.matches('button,a,input,select,textarea') || !['Enter', ' '].includes(event.key)) return;
    event.preventDefault();
    target.click();
  });
  const group = document.querySelector('[data-design-page-group]');
  const picker = document.querySelector('[data-design-page-picker]');
  const current = JSON.parse(document.querySelector('#design-snapshot-metadata').textContent);
  for (const name of new Set(pages.map((page) => page.group))) group.add(new Option(name, name));
  const fillPages = () => {
    picker.replaceChildren();
    for (const page of pages.filter((page) => page.group === group.value)) picker.add(new Option(page.title, page.id));
    if (available.has(current.id) && current.group === group.value) picker.value = current.id;
  };
  group.value = current.group;
  fillPages();
  group.addEventListener('change', fillPages);
  document.querySelector('[data-design-page-open]').addEventListener('click', () => {
    if (available.has(picker.value)) location.href = `${picker.value}.html`;
  });
})();</script></body></html>
