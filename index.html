<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        if (window.electron?.traceEnabled !== true) return;
        const startedAt = performance.now();
        const trace = (phase, detail = {}) => console.info(`[startup-trace] ${JSON.stringify({
          source: 'renderer.html', phase, at: Date.now(), navigationMs: Math.round(performance.now()), ...detail,
        })}`);
        trace('inline.start', { readyState: document.readyState });
        const resourceKind = (entry) => {
          if (!['script', 'link', 'css'].includes(entry.initiatorType)) return null;
          const url = new URL(entry.name);
          if (url.origin !== location.origin || url.protocol !== location.protocol) return null;
          if (url.pathname === '/@vite/client' || url.pathname === '/@react-refresh') return 'vite-client';
          if (!/\.(?:[cm]?js|[jt]sx?|css)$/.test(url.pathname)) return null;
          if (url.pathname.startsWith('/src/')) return url.pathname.endsWith('.css') ? 'stylesheet' : 'source-module';
          if (url.pathname.startsWith('/node_modules/')) return url.pathname.endsWith('.css') ? 'stylesheet' : 'vite-dependency';
          if (url.pathname.startsWith(new URL('./assets/', location.href).pathname)) {
            return url.pathname.endsWith('.css') ? 'stylesheet' : 'bundle-script';
          }
          return null;
        };
        let resourceCount = 0;
        const reportResources = (entries) => {
          for (const entry of entries) {
            if (resourceCount >= 8 || entry.duration < 100) continue;
            const kind = resourceKind(entry);
            if (!kind) continue;
            resourceCount += 1;
            trace('resource.slow', {
              kind, startTime: Math.round(entry.startTime), requestStart: Math.round(entry.requestStart),
              responseStart: Math.round(entry.responseStart), responseEnd: Math.round(entry.responseEnd),
              durationMs: Math.round(entry.duration),
            });
          }
        };
        const resources = new PerformanceObserver((list) => reportResources(list.getEntries()));
        resources.observe({ type: 'resource', buffered: true });
        let longTaskCount = 0;
        const reportLongTasks = (entries) => {
          for (const entry of entries) {
            if (longTaskCount >= 8) break;
            longTaskCount += 1;
            trace('long-task', { startTime: Math.round(entry.startTime), durationMs: Math.round(entry.duration) });
          }
        };
        const longTasks = new PerformanceObserver((list) => reportLongTasks(list.getEntries()));
        if (PerformanceObserver.supportedEntryTypes.includes('longtask')) longTasks.observe({ type: 'longtask', buffered: true });
        const paints = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (entry.name !== 'first-paint' && entry.name !== 'first-contentful-paint') continue;
            trace('paint', { kind: entry.name, startTime: Math.round(entry.startTime) });
            if (entry.name === 'first-contentful-paint') paints.disconnect();
          }
        });
        paints.observe({ type: 'paint', buffered: true });
        window.addEventListener('pagehide', () => paints.disconnect(), { once: true });
        const onError = () => trace('window.error', { outcome: 'error' });
        const onRejection = () => trace('window.unhandled-rejection', { outcome: 'error' });
        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', onRejection);
        document.addEventListener('DOMContentLoaded', () => trace('dom.content-loaded', {
          durationMs: Math.round(performance.now() - startedAt),
        }), { once: true });
        window.addEventListener('load', () => {
          trace('window.load', { durationMs: Math.round(performance.now() - startedAt) });
          reportResources(resources.takeRecords());
          reportLongTasks(longTasks.takeRecords());
          resources.disconnect();
          longTasks.disconnect();
          window.removeEventListener('error', onError, true);
          window.removeEventListener('unhandledrejection', onRejection);
          const navigation = performance.getEntriesByType('navigation')[0];
          if (navigation) trace('navigation.timing', {
            fetchStart: Math.round(navigation.fetchStart), requestStart: Math.round(navigation.requestStart),
            responseStart: Math.round(navigation.responseStart), responseEnd: Math.round(navigation.responseEnd),
            domInteractive: Math.round(navigation.domInteractive),
            domContentLoaded: Math.round(navigation.domContentLoadedEventStart),
            loadStart: Math.round(navigation.loadEventStart),
          });
          const moduleBody = performance.getEntriesByName('matchaclaw.renderer.module-body')[0]?.startTime;
          const staticResources = performance.getEntriesByType('resource').filter((entry) => resourceKind(entry));
          const beforeModule = staticResources.filter((entry) => moduleBody !== undefined && entry.responseEnd <= moduleBody);
          const lastResponseEnd = beforeModule.reduce((latest, entry) => Math.max(latest, entry.responseEnd), 0);
          trace('resource.summary', {
            count: staticResources.length, lastResponseEnd: Math.round(lastResponseEnd),
            moduleBodyMs: moduleBody === undefined ? null : Math.round(moduleBody),
            afterLastResponseMs: moduleBody === undefined ? null : Math.round(moduleBody - lastResponseEnd),
          });
        }, { once: true });
      })();
    </script>
    <script>
      (() => {
        const lightSurface = '#ffffff';
        const darkSurface = '#1e1e20';
        const readSettings = () => {
          try {
            return JSON.parse(window.localStorage.getItem('matchaclaw-settings') || '{}')?.state || {};
          } catch {
            return {};
          }
        };
        const settings = readSettings();
        const resolveTheme = () => {
          if (settings.theme === 'light' || settings.theme === 'dark') return settings.theme;
          return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        const theme = resolveTheme();
        const surface = theme === 'dark' ? darkSurface : lightSurface;
        const root = document.documentElement;
        root.classList.add(theme);
        root.dataset.themeSurface = theme;
        root.style.backgroundColor = surface;
        root.style.setProperty('--matchaclaw-initial-surface', surface);
      })();
    </script>
    <style>
      :root {
        --background: 240 11% 95%;
        --foreground: 220 12% 13%;
        --card: 0 0% 100%;
        --border: 225 12% 89%;
        --ring: 208 88% 43%;
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color-scheme: light;
      }
      .dark {
        --background: 0 0% 10%;
        --foreground: 220 18% 94%;
        --card: 220 3% 12%;
        --border: 215 8% 23%;
        --ring: 225 69% 48%;
        color-scheme: dark;
      }
      html,
      body,
      #root {
        min-height: 100%;
        background: var(--matchaclaw-initial-surface, hsl(var(--card)));
      }
      body {
        margin: 0;
        color: hsl(var(--foreground));
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        background: hsl(var(--card));
      }
      .initial-boot-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 46%, hsl(var(--ring) / 0.10), transparent 32%),
          hsl(var(--card));
      }
      .initial-boot-core {
        display: grid;
        place-items: center;
        text-align: center;
      }
      .initial-wordmark {
        margin-bottom: 28px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.04em;
      }
      .initial-orbit {
        position: relative;
        display: grid;
        width: 176px;
        height: 176px;
        place-items: center;
      }
      .initial-orbit-glow {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: hsl(var(--ring) / 0.10);
        filter: blur(26px);
      }
      .initial-orbit-shell,
      .initial-orbit-rail,
      .initial-orbit-runner {
        position: absolute;
      }
      .initial-orbit-shell {
        inset: 16px;
        border: 1px solid hsl(var(--border) / 0.70);
        border-radius: 34%;
        background: hsl(var(--card) / 0.82);
        box-shadow: 0 26px 80px hsl(var(--foreground) / 0.10);
      }
      .initial-orbit-shell.is-a {
        transform: rotate(45deg);
        border-color: hsl(var(--ring) / 0.15);
        background: transparent;
      }
      .initial-orbit-shell.is-b {
        transform: rotate(-12deg);
        border-color: hsl(var(--border) / 0.55);
        background: transparent;
      }
      .initial-orbit-rail,
      .initial-orbit-runner {
        inset: 48px;
        border-radius: 999px;
      }
      .initial-orbit-rail {
        border: 1px solid hsl(var(--ring) / 0.15);
      }
      .initial-orbit-runner {
        background: conic-gradient(from 12deg, hsl(var(--ring)) 0deg, hsl(var(--ring) / 0.76) 86deg, transparent 112deg, transparent 360deg);
        animation: initial-orbit-spin 1.05s linear infinite;
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      }
      .initial-mark {
        position: relative;
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border: 1px solid hsl(var(--border));
        border-radius: 30%;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.03em;
        box-shadow: 0 4px 16px hsl(var(--foreground) / 0.06);
      }
      .initial-title {
        margin: 32px 0 0;
        font-size: 20px;
        font-weight: 650;
        line-height: 1.25;
        letter-spacing: -0.03em;
      }
      @keyframes initial-orbit-spin {
        to { transform: rotate(360deg); }
      }
      @media (max-width: 560px) {
        .initial-orbit {
          width: 156px;
          height: 156px;
        }
        .initial-orbit-shell {
          inset: 14px;
        }
        .initial-orbit-rail,
        .initial-orbit-runner {
          inset: 42px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-orbit-runner {
          animation: none;
        }
      }
    </style>
    <title>MatchaClaw</title>
  </head>
  <body>
    <script>
      if (window.electron?.traceEnabled === true) {
        console.info(`[startup-trace] ${JSON.stringify({
          source: 'renderer.html', phase: 'boot-shell.before', at: Date.now(), navigationMs: Math.round(performance.now()),
        })}`);
      }
    </script>
    <div id="root">
      <main class="initial-boot-shell" role="status" aria-live="polite" aria-label="正在初始化工作区">
        <section class="initial-boot-core">
          <div class="initial-wordmark">Matcha</div>
          <div class="initial-orbit" aria-hidden="true">
            <div class="initial-orbit-glow"></div>
            <div class="initial-orbit-shell"></div>
            <div class="initial-orbit-shell is-a"></div>
            <div class="initial-orbit-shell is-b"></div>
            <div class="initial-orbit-rail"></div>
            <div class="initial-orbit-runner"></div>
            <div class="initial-mark">M</div>
          </div>
          <h1 class="initial-title">正在初始化工作区</h1>
        </section>
      </main>
    </div>
    <script>
      if (window.electron?.traceEnabled === true) {
        performance.mark('matchaclaw.html.module-tag.before');
        console.info(`[startup-trace] ${JSON.stringify({
          source: 'renderer.html', phase: 'boot-shell.ready', at: Date.now(), navigationMs: Math.round(performance.now()),
        })}`);
        console.info(`[startup-trace] ${JSON.stringify({
          source: 'renderer.html', phase: 'module-tag.before', at: Date.now(), navigationMs: Math.round(performance.now()),
        })}`);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (window.electron?.traceEnabled === true) {
        console.info(`[startup-trace] ${JSON.stringify({
          source: 'renderer.html', phase: 'module-tag.after', at: Date.now(), navigationMs: Math.round(performance.now()),
        })}`);
      }
    </script>
  </body>
</html>
