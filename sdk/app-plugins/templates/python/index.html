<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Python Echo</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
    body { max-width: 42rem; margin: auto; padding: 24px; }
    h1 { font-size: 1.5rem; margin-top: 0; }
    label, textarea, button, output { display: block; }
    textarea { box-sizing: border-box; width: 100%; min-height: 8rem; margin: 8px 0 12px; padding: 10px; font: inherit; }
    button { padding: 8px 18px; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    pre { min-height: 2rem; padding: 12px; border: 1px solid GrayText; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #event { color: GrayText; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Python Echo</h1>
    <p id="description">Local echo only. No model calls or model charges.</p>
    <form id="form">
      <label id="message-label" for="message">Message</label>
      <textarea id="message" maxlength="4096"></textarea>
      <button id="submit" type="submit">Echo</button>
    </form>
    <h2 id="result-label">Result</h2>
    <pre id="result" role="status" aria-live="polite" aria-labelledby="result-label"></pre>
    <output id="event" aria-live="polite"></output>
  </main>
  <script>
    const translations = {
      en: { title: 'Python Echo', description: 'Local echo only. No model calls or model charges.', message: 'Message',
        submit: 'Echo', busy: 'Running…', result: 'Result', event: 'Echo event', unavailable: 'Open this application in Matcha to call its Python backend.',
        failed: 'Echo failed. Check the plugin logs.', invalid: 'The backend returned an invalid echo result.' },
      zh: { title: 'Python 回声', description: '仅在本地回显，不调用模型，不产生模型费用。', message: '消息',
        submit: '回显', busy: '运行中…', result: '结果', event: '回显事件', unavailable: '请在 Matcha 中打开此应用以调用 Python 后台。',
        failed: '回显失败，请查看插件日志。', invalid: '后台返回的回显结果无效。' },
      ja: { title: 'Python エコー', description: 'ローカルで入力を返します。モデル呼び出しやモデル料金は発生しません。', message: 'メッセージ',
        submit: 'エコー', busy: '実行中…', result: '結果', event: 'エコーイベント', unavailable: 'Python バックエンドを呼び出すには Matcha でこのアプリを開いてください。',
        failed: 'エコーに失敗しました。プラグインのログを確認してください。', invalid: 'バックエンドから無効なエコー結果が返されました。' },
      ru: { title: 'Python Эхо', description: 'Локальное эхо без вызовов моделей и расходов на них.', message: 'Сообщение',
        submit: 'Повторить', busy: 'Выполняется…', result: 'Результат', event: 'Событие эхо', unavailable: 'Откройте приложение в Matcha для вызова Python-бэкенда.',
        failed: 'Ошибка эхо. Проверьте журнал плагина.', invalid: 'Бэкенд вернул некорректный результат эхо.' }
    };
    const app = window.matchaApp;
    const form = document.getElementById('form');
    const input = document.getElementById('message');
    const submit = document.getElementById('submit');
    const result = document.getElementById('result');
    const eventOutput = document.getElementById('event');
    let text, busy = false, lastEvent, resultState = 'empty';
    function setLanguage(language) {
      const locale = String(language || 'en').toLowerCase().split(/[-_]/)[0];
      text = translations[locale] || translations.en;
      document.documentElement.lang = translations[locale] ? locale : 'en';
      document.title = text.title;
      for (const [id, key] of [['title', 'title'], ['description', 'description'], ['message-label', 'message'], ['result-label', 'result']]) {
        document.getElementById(id).textContent = text[key];
      }
      submit.textContent = busy ? text.busy : text.submit;
      if (['unavailable', 'failed', 'invalid'].includes(resultState)) result.textContent = text[resultState];
      if (lastEvent !== undefined) eventOutput.textContent = `${text.event}: ${lastEvent}`;
    }
    setLanguage(app?.context.language || navigator.language);
    if (!app) {
      submit.disabled = true;
      resultState = 'unavailable';
      result.textContent = text.unavailable;
    }
    const unsubscribe = app?.subscribe((event) => {
      if (event.topic === 'locale.changed') setLanguage(event.data?.language);
      if (event.topic === 'echo' && typeof event.data?.message === 'string') {
        lastEvent = event.data.message;
        eventOutput.textContent = `${text.event}: ${lastEvent}`;
      }
    });
    window.addEventListener('pagehide', () => unsubscribe?.(), { once: true });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (busy || !app) return;
      busy = true;
      submit.disabled = true;
      submit.textContent = text.busy;
      try {
        const response = await app.call('echo', { message: input.value });
        if (response.isError) {
          resultState = 'failed';
          result.textContent = response.content.filter((block) => block.type === 'text').map((block) => block.text).join('\n') || text.failed;
        } else if (typeof response.structuredContent?.message !== 'string') {
          resultState = 'invalid';
          result.textContent = text.invalid;
        } else {
          resultState = 'success';
          result.textContent = response.structuredContent.message;
        }
      } catch {
        resultState = 'failed';
        result.textContent = text.failed;
      } finally {
        busy = false;
        submit.disabled = false;
        submit.textContent = text.submit;
      }
    });
  </script>
</body>
</html>
